[project]
name = "agent-base"
version = "0.1.0.dev0"
description = "A reusable base agent: subclass it, add skills and tools, pick a model in YAML."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khaled El-Sayed" }]
dependencies = [
    "pydantic>=2.9,<3",
    "typer>=0.15",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.11,<2"]
openai = ["openai>=3.24,<4"]
all = ["agent-base[anthropic,openai]"]

[project.scripts]
agent = "agent_base.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_base"]

[tool.pytest.ini_options]
testpaths = ["tests", "agents"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/requirements.md"]  # verbatim export of the Claude Doc

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF012: agents declare `tools = [...]` / `skills = [...]` as plain class attributes by design.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
