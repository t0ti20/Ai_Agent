# yaml-language-server: $schema=schema/agent.schema.json
# Model profiles. Pick one with `model.profile`, or per run with `--profile <name>`.
# Secrets are referenced as ${ENV_VAR} (put them in .env for development), never written here.
# Prices are USD per million tokens and drive cost tracking and max_cost_usd budgets.

profiles:
  smart:
    adapter: anthropic
    model: claude-opus-5-5
    max_output_tokens: 64000
    price: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    options:
      fallbacks: default          # if Claude declines a request, re-run it on Anthropic's recommended fallback model

  fast:
    adapter: anthropic
    model: claude-sonnet-5-5
    max_output_tokens: 64000
    price: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    options:
      fallbacks: default

  openai:
    adapter: openai
    model: ${OPENAI_MODEL:-gpt-5}  # set OPENAI_MODEL to the model you use
    api_key: ${OPENAI_API_KEY}
    capabilities: {thinking: true} # sends the effort knob as reasoning_effort

  local:
    adapter: openai_compat
    base_url: ${OLLAMA_URL:-http://localhost:11434/v1}
    model: ${LOCAL_MODEL:-qwen3:14b}
    timeout_s: 900
    price: {input: 0, output: 0}

  mock:
    adapter: mock                  # scripted model for offline runs and tests; echoes when out of script
    model: mock
